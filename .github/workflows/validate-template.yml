name: Validate Template

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify required files exist
        run: |
          required_files=(
            README.md
            AGENTS.md
            CLAUDE.md
            .gitignore
            .env.example
            docs/DEVELOPMENT_PROCESS.md
            docs/QUALITY_GATES.md
            docs/REPO_SETTINGS.md
            docs/app/00-README.md
            docs/app/01-PRODUCT.md
            docs/app/02-DATA.md
            docs/app/03-DESIGN.md
            docs/app/04-ARCHITECTURE.md
            docs/app/05-BUILD-RULES.md
            docs/app/06-DECISIONS.md
            .github/PULL_REQUEST_TEMPLATE.md
            .github/workflows/validate-template.yml
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check markdown links
        run: |
          find . -name '*.md' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            npx -y markdown-link-check -q "$file"
          done
